[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-learning"
version = "0.1.0"
description = "A learning repository for LangChain"
dependencies = [
    "langchain",
    "openai",
    "langchain-openai",
    "langchain-community",
    "langchain-core"
]

[tool.setuptools]
packages = ["basics", "components", "advanced", "reasoning", "integration", "practice", "projects", "experiments", "tests"]